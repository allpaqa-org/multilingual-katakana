name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Test, Lint & Complexity Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build NAPI-RS native addon for this runner
        run: |
          cargo build --release -p multilingual-katakana-node
          mkdir -p bindings/node/native
          cp target/release/libmultilingual_katakana_node.so \
            bindings/node/native/multilingual-katakana.linux-x64-gnu.node

      - name: Bun Quality Gate (test, lint, complexity, spec)
        uses: ./.github/actions/bun-quality-gate

      - name: Check lockstep versions across all manifests
        # npm / Cargo / PyPI / NuGet manifests must share one version
        # (docs/RELEASE_PROCESS.md §3); the tag itself is checked by the
        # release-time verify-versions jobs.
        run: bun run scripts/check_versions.ts

      - name: Run Tests with native backend forced (must not silently fall back)
        run: cd bindings/node && MULTILINGUAL_KATAKANA_BACKEND=native bun test

      - name: Build Dual ESM/CJS Package
        run: bun run build

  test-darwin-x64:
    name: Test & Native Backend (darwin-x64, real hardware)
    # `macos-15-intel` is a real Intel (x86_64) macOS GitHub-hosted runner,
    # free and unlimited on public repos (see
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners).
    # This verifies the native backend on real darwin-x64 hardware instead
    # of relying on cross-build + Rosetta emulation (see docs/adr and
    # docs/V0.4.0_BINDINGS_SCOPE.md §8.1).
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build NAPI-RS native addon for this runner
        run: |
          cargo build --release -p multilingual-katakana-node
          mkdir -p bindings/node/native
          cp target/release/libmultilingual_katakana_node.dylib \
            bindings/node/native/multilingual-katakana.darwin-x64.node

      - name: Install dependencies
        run: cd bindings/node && bun install

      - name: Run Tests (100% pass required)
        run: bun run test

      - name: Run Tests with native backend forced (must not silently fall back)
        run: cd bindings/node && MULTILINGUAL_KATAKANA_BACKEND=native bun test

  rust-check:
    name: Rust Core (Test, Clippy & Fmt)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Rust Quality Gate (test, clippy, fmt)
        uses: ./.github/actions/rust-quality-gate

  python-binding:
    name: Python Binding (spec + API tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create venv and install maturin & pytest
        # `maturin develop` refuses to run without an active virtualenv/conda
        # env (or a `.venv` next to pyproject.toml) — actions/setup-python
        # alone does not provide one.
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install maturin pytest

      - name: Build native extension and install editable
        run: cd bindings/python && maturin develop --release

      - name: Verify zero runtime dependencies
        run: |
          python -c "
          import tomllib
          with open('bindings/python/pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project'].get('dependencies', [])
          assert deps == [], f'dependencies must be empty, got: {deps}'
          print('OK: dependencies = []')
          "

      - name: Run Tests (100% pass required, 209 spec cases)
        run: cd bindings/python && python -m pytest -v

  dotnet-binding:
    name: Dotnet Binding (spec + API tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET
        # 10.0.x SDK builds the .slnx solution; 8.0.x provides the runtime
        # the net8.0 test project runs on.
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build C ABI library and stage it for this runner
        run: bun run scripts/stage_dotnet_native.ts

      - name: Build, test (100% pass required, 209 spec cases) and format check
        run: |
          cd bindings/dotnet
          dotnet build -c Release
          dotnet test -c Release --no-build
          dotnet format --verify-no-changes
