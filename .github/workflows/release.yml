name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-pack:
    name: Verify Quality Gates & Build Tarball
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Rust Quality Gate (test, clippy, fmt)
        uses: ./.github/actions/rust-quality-gate

      - name: Bun Quality Gate (test, lint, complexity, spec)
        uses: ./.github/actions/bun-quality-gate

      - name: Build Dual ESM/CJS Package
        run: bun run build

      - name: Pack npm tarball
        run: |
          mkdir -p dist && cd bindings/node && npm pack --pack-destination ../../dist

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: dist/*.tgz
          retention-days: 1

  draft-release:
    name: Create Draft Release on GitHub
    needs: verify-and-pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Tarball Artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: dist

      - name: Create Draft Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
