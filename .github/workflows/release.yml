name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-pack:
    name: Verify Quality Gates & Build Tarball
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Cargo Tests (100% pass required)
        run: cargo test --all-targets

      - name: Run Clippy (0 warnings required)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd bindings/node && bun install

      - name: Run Quality Gate
        run: |
          bun run test
          bun run check:ci
          bun run check:complexity
          bun run validate:spec

      - name: Build Dual ESM/CJS Package
        run: bun run build

      - name: Pack npm tarball
        run: |
          mkdir -p dist && cd bindings/node && npm pack --pack-destination ../../dist

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: dist/*.tgz
          retention-days: 1

  draft-release:
    name: Create Draft Release on GitHub
    needs: verify-and-pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Tarball Artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: dist

      - name: Create Draft Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
