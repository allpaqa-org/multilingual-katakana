[package]
name = "multilingual-katakana-core"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Ultra-fast (<0.05ms) multilingual to Katakana converter for Japanese TTS"
repository = "https://github.com/allpaqa-org/multilingual-katakana"
readme = "README.md"
keywords = ["katakana", "tts", "voicevox", "multilingual", "japanese"]
categories = ["text-processing", "localization"]

[dependencies]
regex = "1.10"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
